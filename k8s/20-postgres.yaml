# StatefulSet = for programs that keep data. It gets a disk (PVC) that survives pod restarts.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ticketrush
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - {name: POSTGRES_USER, valueFrom: {secretKeyRef: {name: ticketrush-secrets, key: POSTGRES_USER}}}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: ticketrush-secrets, key: POSTGRES_PASSWORD}}}
            - {name: POSTGRES_DB, valueFrom: {secretKeyRef: {name: ticketrush-secrets, key: POSTGRES_DB}}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d}   # schema + sample events, runs on first start only
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\""]
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 1000m, memory: 512Mi}
      volumes:
        - name: init
          configMap: {name: db-init}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: {storage: 1Gi}
---
# Service = a stable name ("postgres") for pods that keep changing IP addresses.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ticketrush
spec:
  selector: {app: postgres}
  ports:
    - {port: 5432, targetPort: 5432}
