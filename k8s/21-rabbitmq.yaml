# The queue. No disk here (kept simple): if this pod is deleted, waiting bookings are lost. See limitations.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: ticketrush
spec:
  replicas: 1
  selector:
    matchLabels: {app: rabbitmq}
  template:
    metadata:
      labels: {app: rabbitmq}
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          ports:
            - {containerPort: 5672}
            - {containerPort: 15672}
          env:
            - {name: RABBITMQ_DEFAULT_USER, valueFrom: {secretKeyRef: {name: ticketrush-secrets, key: RABBITMQ_DEFAULT_USER}}}
            - {name: RABBITMQ_DEFAULT_PASS, valueFrom: {secretKeyRef: {name: ticketrush-secrets, key: RABBITMQ_DEFAULT_PASS}}}
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
                      readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: ticketrush
spec:
  selector: {app: rabbitmq}
  ports:
    - {name: amqp, port: 5672, targetPort: 5672}
    - {name: ui, port: 15672, targetPort: 15672}
