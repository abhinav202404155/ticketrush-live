# Monitoring: Prometheus collects numbers every 5s, Grafana draws them. No disk (history is lost if pods restart).
apiVersion: v1
kind: ServiceAccount
metadata: {name: prometheus, namespace: ticketrush}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role                          # permission to LIST pods (only inside our namespace) so Prometheus can find them
metadata: {name: prometheus, namespace: ticketrush}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: prometheus, namespace: ticketrush}
subjects: [{kind: ServiceAccount, name: prometheus, namespace: ticketrush}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: prometheus}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus-config, namespace: ticketrush}
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: ticketrush-apps          # every pod annotated prometheus.io/scrape=true (Part 3 added these)
        kubernetes_sd_configs:
          - role: pod
            namespaces: {names: [ticketrush]}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: (.+);(.+)
            replacement: ${1}:${2}
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      - job_name: rabbitmq                 # RabbitMQ's built-in Prometheus plugin listens on 15692
        kubernetes_sd_configs:
          - role: pod
            namespaces: {names: [ticketrush]}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: rabbitmq
          - source_labels: [__meta_kubernetes_pod_ip]
            regex: (.*)
            replacement: ${1}:15692
            target_label: __address__
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: ticketrush}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
          ports: [{containerPort: 9090}]
          volumeMounts: [{name: config, mountPath: /etc/prometheus}]
          readinessProbe: {httpGet: {path: /-/ready, port: 9090}, periodSeconds: 5}
          resources:
            requests: {cpu: 100m, memory: 200Mi}
            limits: {cpu: 500m, memory: 500Mi}
      volumes: [{name: config, configMap: {name: prometheus-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: ticketrush}
spec:
  selector: {app: prometheus}
  ports: [{port: 9090, targetPort: 9090}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-datasource, namespace: ticketrush}
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prom
        access: proxy
        url: http://prometheus:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-provider, namespace: ticketrush}
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: ticketrush
        type: file
        options: {path: /var/lib/grafana/dashboards}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-dashboard, namespace: ticketrush}
data:
  rush.json: |
    {
     "uid": "ticketrush-rush",
     "title": "TicketRush: rush dashboard",
     "schemaVersion": 39,
     "version": 1,
     "refresh": "5s",
     "time": {
      "from": "now-15m",
      "to": "now"
     },
     "panels": [
      {
       "id": 1,
       "type": "timeseries",
       "title": "Queue length (waiting bookings)",
       "gridPos": {
        "x": 0,
        "y": 0,
        "w": 12,
        "h": 8
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prom"
       },
       "targets": [
        {
         "expr": "rabbitmq_queue_messages_ready",
         "legendFormat": "ready",
         "refId": "A"
        }
       ]
      },
      {
       "id": 2,
       "type": "timeseries",
       "title": "Worker pods (KEDA scales these)",
       "gridPos": {
        "x": 12,
        "y": 0,
        "w": 12,
        "h": 8
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prom"
       },
       "targets": [
        {
         "expr": "count(up{job=\"ticketrush-apps\",app=\"booking-worker\"} == 1)",
         "legendFormat": "workers",
         "refId": "A"
        }
       ]
      },
      {
       "id": 3,
       "type": "timeseries",
       "title": "API pods (HPA scales these)",
       "gridPos": {
        "x": 0,
        "y": 8,
        "w": 12,
        "h": 8
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prom"
       },
       "targets": [
        {
         "expr": "count by (app) (up{job=\"ticketrush-apps\",app=~\".*-service\"} == 1)",
         "legendFormat": "{{app}}",
         "refId": "A"
        }
       ]
      },
      {
       "id": 4,
       "type": "timeseries",
       "title": "Bookings processed per second",
       "gridPos": {
        "x": 12,
        "y": 8,
        "w": 12,
        "h": 8
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prom"
       },
       "targets": [
        {
         "expr": "sum by (result) (rate(worker_bookings_processed_total[30s]))",
         "legendFormat": "{{result}}",
         "refId": "A"
        }
       ]
      },
      {
       "id": 5,
       "type": "timeseries",
       "title": "Booking success % (seat won)",
       "gridPos": {
        "x": 0,
        "y": 16,
        "w": 12,
        "h": 8
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prom"
       },
       "targets": [
        {
         "expr": "100 * sum(rate(worker_bookings_processed_total{result=\"HELD\"}[1m])) / sum(rate(worker_bookings_processed_total[1m]))",
         "legendFormat": "success %",
         "refId": "A"
        }
       ]
      },
      {
       "id": 6,
       "type": "timeseries",
       "title": "Requests per second by service",
       "gridPos": {
        "x": 12,
        "y": 16,
        "w": 12,
        "h": 8
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prom"
       },
       "targets": [
        {
         "expr": "sum by (app) (rate(http_requests_total[30s]))",
         "legendFormat": "{{app}}",
         "refId": "A"
        }
       ]
      },
      {
       "id": 7,
       "type": "timeseries",
       "title": "booking-service p95 latency (s)",
       "gridPos": {
        "x": 0,
        "y": 24,
        "w": 12,
        "h": 8
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prom"
       },
       "targets": [
        {
         "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_highr_seconds_bucket{app=\"booking-service\"}[1m])))",
         "legendFormat": "p95",
         "refId": "A"
        }
       ]
      }
     ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana, namespace: ticketrush}
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          env:
            - {name: GF_SECURITY_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: ticketrush-secrets, key: ADMIN_KEY}}}   # admin password = ADMIN_KEY from .env
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}        # anyone on this local URL can VIEW
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
          ports: [{containerPort: 3000}]
          volumeMounts:
            - {name: ds, mountPath: /etc/grafana/provisioning/datasources}
            - {name: prov, mountPath: /etc/grafana/provisioning/dashboards}
            - {name: dash, mountPath: /var/lib/grafana/dashboards}
          readinessProbe: {httpGet: {path: /api/health, port: 3000}, periodSeconds: 5}
          resources:
            requests: {cpu: 50m, memory: 120Mi}
            limits: {cpu: 500m, memory: 300Mi}
      volumes:
        - {name: ds, configMap: {name: grafana-datasource}}
        - {name: prov, configMap: {name: grafana-provider}}
        - {name: dash, configMap: {name: grafana-dashboard}}
---
apiVersion: v1
kind: Service
metadata: {name: grafana, namespace: ticketrush}
spec:
  selector: {app: grafana}
  ports: [{port: 3000, targetPort: 3000}]
