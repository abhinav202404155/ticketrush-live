# Deployment = "keep N copies of this container running". Each has a Service for a stable address.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: ticketrush
  labels: {app: user-service}
spec:
  replicas: 1               # autoscalers change this number
  selector:
    matchLabels: {app: user-service}
  template:
    metadata:
      labels: {app: user-service}
      annotations:
        prometheus.io/scrape: "true"      # Prometheus (Part 4) finds metrics through these 3 lines
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: user-service
          image: ticketrush/user-service:dev
          imagePullPolicy: IfNotPresent    # we build images inside Minikube, no registry needed
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: {name: ticketrush-config}
            - secretRef: {name: ticketrush-secrets}
          readinessProbe:            # "is it ready to get traffic?" (if not, Service skips this pod)
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:             # "is it stuck?" (if yes, Kubernetes restarts it = self-healing)
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:             # autoscaling needs "requests" to calculate CPU percent
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: ticketrush
spec:
  selector: {app: user-service}
  ports:
    - {port: 8000, targetPort: 8000}
---
