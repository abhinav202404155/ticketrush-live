# On every push: check the code, then build 5 images for BOTH amd64 (PC) and arm64 (Oracle/ARM servers) and push to GHCR.
# Free for PUBLIC repositories. After the first push, set each package to "Public" in GitHub (Packages) so servers can pull without a password.
name: ci
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
  packages: write
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m compileall -q services worker tests loadtest
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd frontend && npm install && npm run build
  images:
    needs: checks
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: user-service,    path: services/user-service }
          - { name: catalog-service, path: services/catalog-service }
          - { name: booking-service, path: services/booking-service }
          - { name: booking-worker,  path: worker }
          - { name: frontend,        path: frontend }
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase owner (registry names must be lowercase)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.path }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/ticketrush-${{ matrix.name }}:latest
            ghcr.io/${{ env.OWNER }}/ticketrush-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
