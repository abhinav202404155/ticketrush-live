server {
  listen 80;
  root /usr/share/nginx/html;
  # Pass the real visitor IP to the APIs, so rate limits are per visitor and not per nginx pod
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header Host $host;
  location / { try_files $uri /index.html; }
  location /api/users    { proxy_pass http://user-service:8000; }
  location /api/shows    { proxy_pass http://catalog-service:8000; }
  location /api/events   { proxy_pass http://catalog-service:8000; }
  location /api/cities   { proxy_pass http://catalog-service:8000; }
  location /api/bookings { proxy_pass http://booking-service:8000; }
  location /api/admin    { proxy_pass http://booking-service:8000; }
}
